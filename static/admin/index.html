<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Harivant Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Correct Supabase v2 CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #0b1320;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      opacity: 0.7;
    }

    .preview {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .preview img {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Harivant Admin Panel</h1>

    <input id="title" placeholder="Post Title" />
    <textarea id="content" placeholder="Post Content"></textarea>
    <input id="image" placeholder="Image URL" />
    <input id="pdf" placeholder="PDF URL (optional)" />

    <button onclick="publishPost()">Publish Post</button>

    <div class="note">Data will be saved directly to Supabase</div>

    <!-- 🔍 LIVE PREVIEW -->
    <div class="preview" id="preview"></div>
  </div>

  <script>
    // ✅ SUPABASE CONFIG (CORRECT)
    const supabaseUrl = "https://qjzvkdfidjsaykcnhigi.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqenZrZGZpZGpzYXlrY25oaWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5Mzg4MDMsImV4cCI6MjA4MTUxNDgwM30.aH0oU7wnQ6C5jIKtBvN6Dv_p1kppQsogYLNXgqLekB8";

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function publishPost() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const image_url = document.getElementById("image").value.trim();
      const pdf_url = document.getElementById("pdf").value.trim();

      if (!title || !content) {
        alert("Title aur Content mandatory hai");
        return;
      }

      const { error } = await supabase
        .from("pages")
        .insert([
          {
            title,
            content,
            image_url: image_url || null,
            pdf_url: pdf_url || null
          }
        ]);

      if (error) {
        alert("❌ ERROR: " + error.message);
      } else {
        alert("✅ POST SAVED SUCCESSFULLY");

        // 🔍 Preview
        document.getElementById("preview").innerHTML = `
          <h3>${title}</h3>
          <p>${content}</p>
          ${image_url ? `<img src="${image_url}">` : ""}
          ${pdf_url ? `<a href="${pdf_url}" target="_blank">📄 View PDF</a>` : ""}
        `;

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
        document.getElementById("image").value = "";
        document.getElementById("pdf").value = "";
      }
    }
  </script>

</body>
</html>
