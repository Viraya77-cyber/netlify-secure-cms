<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Harivant Admin Panel</title>
</head>
<body>

<h2>Harivant Admin Panel</h2>
<button onclick="testInsert()">Test Insert</button>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "SUPABASE_URL_HERE";
  const supabaseKey = "SUPABASE_ANON_KEY_HERE";

  const supabase = supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

  async function testInsert() {
    const { data, error } = await supabase
      .from("pages")
      .insert([
        {
          title: "First Admin Post",
          content: "Connected successfully",
          image_url: "",
          pdf_url: ""
        }
      ]);

    if (error) {
      alert("ERROR: " + error.message);
    } else {
      alert("DATA INSERTED SUCCESSFULLY");
    }
  }
</script>

</body>
</html>
